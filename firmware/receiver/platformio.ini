[env:heltec_wifi_lora_32_V4]
; No dedicated V4 board entry in PlatformIO's registry yet; V4 is pin-compatible
; with V3 (confirmed against Heltec's V4 bring-up guides), so start from that.
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../common
lib_deps =
    jgromes/RadioLib@^7.1.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.3
build_flags =
    -std=c++17
    -DHAB_SF=9
    ; board manifest sets ARDUINO_USB_MODE=1 (native USB) but not this - without
    ; it, Serial silently binds to a disconnected UART0 instead of the USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=1
monitor_dtr = 0
monitor_rts = 0

[env:heltec_wifi_lora_32_V3]
; V3 reaches the host via a CP2102 UART bridge, so Serial stays on UART0 -
; no ARDUINO_USB_CDC_ON_BOOT here (that flag is V4-only). Pins match V4.
extends = env:heltec_wifi_lora_32_V4
build_flags =
    -std=c++17
    -DHAB_SF=9
