# Phase 0 bench config: anonymous access on the plain MQTT port.
# Fine for a bench/lab network. Add authentication and TLS before this
# broker is ever reachable from anywhere untrusted (ground station in
# the field, phase 2+).
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
