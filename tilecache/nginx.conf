# Caching proxy for OpenStreetMap tiles. Tiles seen while online are kept on disk
# and served when there is no internet (caching proxy is allowed by the OSM tile policy).
# Warm it before a flight by opening the dashboard map over the launch/landing area.
proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:50m max_size=2g inactive=365d use_temp_path=off;

server {
    resolver 127.0.0.11 valid=30s ipv6=off;  # Docker DNS; required for proxy_pass with variables
    listen 80;

    location ~ ^/(\d+)/(\d+)/(\d+)\.png$ {
        proxy_pass https://tile.openstreetmap.org$request_uri;
        proxy_ssl_server_name on;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "HAB-phase0-tile-cache (Grafana basemap)";
        proxy_cache tiles;
        proxy_cache_valid 200 365d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 3s;
        add_header Access-Control-Allow-Origin *;
        add_header X-Cache-Status $upstream_cache_status;
    }
}
